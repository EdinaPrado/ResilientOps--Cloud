---
# Opcional: requer metrics-server instalado no cluster.
#   kind:     kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#             (em kind, adicione o argumento --kubelet-insecure-tls no deployment do metrics-server)
#   minikube: minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resilientops-hpa
  namespace: default
  labels:
    app: resilientops-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resilientops-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Espera 5 min antes de reduzir, evitando "sanfona" de réplicas
      stabilizationWindowSeconds: 300